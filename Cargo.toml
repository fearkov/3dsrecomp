[package]
name = "recomp3ds"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Static recompilation toolkit for the Nintendo 3DS"

[[bin]]
name = "3dsrecomp"
path = "src/main.rs"

[features]
# checking recompiled code against Zakuro's interpreter, which it fetches
verify = ["dep:zakuro-cpu", "dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
zakuro-cpu = { git = "https://github.com/fearkov/zakuro", optional = true }

[profile.release]
debug = 1
