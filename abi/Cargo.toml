[package]
name = "recomp-abi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "The interface between the code 3dsrecomp generates and the programs that run it"

[features]
default = ["load"]
# opening libs of recompiled code at runtime
load = ["dep:libloading"]

[dependencies]
libloading = { version = "0.8", optional = true }
